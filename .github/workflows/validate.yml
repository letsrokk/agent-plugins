name: Validate marketplaces

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate marketplace catalogs
        run: python3 scripts/validate_marketplaces.py

      - name: Check plugin version policy
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          python3 scripts/version_plugins.py check "$MERGE_BASE" "$HEAD_SHA"

  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply and push plugin versions
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/version_plugins.py apply "$BASE_SHA" "$HEAD_SHA"

            if git diff --quiet -- plugins/; then
              exit 0
            fi

            git add plugins/
            git commit -m "chore: bump plugin versions"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Version push raced with another main update; retrying ($attempt/3)." >&2
          done

          echo "Could not push plugin versions after 3 attempts." >&2
          exit 1
