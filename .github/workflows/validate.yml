name: Validate marketplaces

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  plugin-changes:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.select.outputs.plugins }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Select changed scripted plugins
        id: select
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          plugins="$(node scripts/plugin_ci.js changed "$BASE_SHA" "$HEAD_SHA")"
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"

  plugin-tests:
    needs: plugin-changes
    if: needs.plugin-changes.outputs.plugins != '[]'
    strategy:
      matrix:
        plugin: ${{ fromJSON(needs.plugin-changes.outputs.plugins) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/${{ matrix.plugin }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run plugin tests
        run: node scripts/test.js

  plugin-validation:
    needs: plugin-changes
    if: needs.plugin-changes.outputs.plugins != '[]'
    strategy:
      matrix:
        plugin: ${{ fromJSON(needs.plugin-changes.outputs.plugins) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/${{ matrix.plugin }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Papercuts build dependencies
        if: matrix.plugin == 'papercuts'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate plugin
        run: node scripts/validate.js

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install repository validation dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Validate marketplace catalogs
        run: npm run validate

      - name: Check plugin version policy
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          node scripts/version_plugins.js check "$MERGE_BASE" "$HEAD_SHA"

  version:
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.plugin-changes.result == 'success' &&
      (needs.plugin-tests.result == 'success' || needs.plugin-tests.result == 'skipped') &&
      (needs.plugin-validation.result == 'success' || needs.plugin-validation.result == 'skipped') &&
      needs.validate.result == 'success'
    needs:
      - plugin-changes
      - plugin-tests
      - plugin-validation
      - validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Apply and push plugin versions
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/version_plugins.js apply "$BASE_SHA" "$HEAD_SHA"

            if git diff --quiet -- plugins/; then
              exit 0
            fi

            git add plugins/
            git commit -m "chore: bump plugin versions"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Version push raced with another main update; retrying ($attempt/3)." >&2
          done

          echo "Could not push plugin versions after 3 attempts." >&2
          exit 1
